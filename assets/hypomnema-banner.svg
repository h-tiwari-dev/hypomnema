<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">Hypomnema</title>
  <desc id="desc">An abstract Attic Greek banner built from black ceramic, terracotta, limestone fragments, monumental lettering, and meander ornament.</desc>

  <defs>
    <pattern id="meander" width="100" height="34" patternUnits="userSpaceOnUse">
      <path d="M7 5h86v24H22V14h47v10H39" fill="none" stroke="#17130f" stroke-width="6" stroke-linejoin="miter"/>
    </pattern>
    <g id="corner-seal">
      <rect width="72" height="30" fill="#17130f"/>
      <path d="M36 5l16 10-16 10-16-10z" fill="none" stroke="#e7dcc3" stroke-width="4"/>
      <circle cx="36" cy="15" r="4" fill="#b44e2f"/>
    </g>
    <g id="ornamental-band">
      <rect x="50" width="1700" height="44" fill="#b44e2f"/>
      <rect x="150" y="5" width="1500" height="34" fill="url(#meander)"/>
      <use href="#corner-seal" x="64" y="7"/>
      <use href="#corner-seal" x="1664" y="7"/>
      <path d="M50 48h1700" stroke="#e7dcc3" stroke-width="2"/>
    </g>
    <clipPath id="terracotta-shard">
      <path d="M1258 96l312 20 129 89-21 190-105 48-293-31-76-91 17-166z"/>
    </clipPath>
    <clipPath id="stone-shard">
      <path d="M1398 126l217-10 81 57-28 183-71 53-231-29-35-74 18-129z"/>
    </clipPath>
  </defs>

  <rect width="1800" height="520" fill="#17130f"/>
  <rect x="20" y="20" width="1760" height="480" fill="none" stroke="#b44e2f" stroke-width="6"/>
  <rect x="32" y="32" width="1736" height="456" fill="none" stroke="#e7dcc3" stroke-width="2"/>
  <rect x="41" y="41" width="1718" height="438" fill="none" stroke="#b44e2f" stroke-width="2"/>

  <use href="#ornamental-band" transform="translate(0 50)"/>
  <use href="#ornamental-band" transform="translate(1800 470) rotate(180)"/>

  <g>
    <text x="94" y="156" fill="#b44e2f" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="25" font-weight="700" letter-spacing="9">ὑπόμνημα</text>
    <text x="86" y="286" fill="#e7dcc3" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="112" font-weight="600" letter-spacing="7">HYPOMNEMA</text>
    <path d="M94 325h862" stroke="#b44e2f" stroke-width="5"/>
    <path d="M94 337h710" stroke="#c8954b" stroke-width="2"/>
    <text x="94" y="386" fill="#e7dcc3" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" letter-spacing="2">NEVER LOSE THE THREAD.</text>
  </g>

  <g transform="translate(290 45) scale(.8)" aria-hidden="true">
    <path d="M1258 96l312 20 129 89-21 190-105 48-293-31-76-91 17-166z" fill="#b44e2f"/>

    <g clip-path="url(#terracotta-shard)" fill="none" stroke="#17130f">
      <path d="M1190 140h390v230h-294V204h207v99h-119v-42h50" stroke-width="18"/>
      <path d="M1210 390h438" stroke-width="9"/>
      <path d="M1230 111l410 322" stroke-width="5"/>
    </g>

    <path d="M1398 126l217-10 81 57-28 183-71 53-231-29-35-74 18-129z" fill="#e7dcc3"/>

    <g clip-path="url(#stone-shard)" fill="#17130f">
      <rect x="1368" y="183" width="250" height="10"/>
      <rect x="1392" y="228" width="206" height="10"/>
      <rect x="1358" y="273" width="265" height="10"/>
      <rect x="1405" y="318" width="182" height="10"/>
    </g>

    <path d="M1167 226l118-30 82 62-21 115-127 15-63-73z" fill="#c8954b"/>
    <path d="M1191 254h108v25h-63v61h78" fill="none" stroke="#17130f" stroke-width="13"/>

    <circle cx="1642" cy="168" r="64" fill="#17130f" stroke="#e7dcc3" stroke-width="5"/>
    <circle cx="1642" cy="168" r="22" fill="none" stroke="#e7dcc3" stroke-width="7"/>
    <path d="M1642 146v-38M1642 190v38M1620 168h-38M1664 168h38M1627 153l-27-27M1657 183l27 27M1657 153l27-27M1627 183l-27 27" stroke="#e7dcc3" stroke-width="7"/>
  </g>
</svg>
